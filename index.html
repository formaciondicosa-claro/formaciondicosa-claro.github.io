<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar Token SGI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --violeta:#a78bfa;
    --violeta-osc:#7c3aed;
    --bg:#0b0c1a;
    --card:rgba(23,24,43,0.55);
    --text:#e8e6ff;
    --muted:#bfbde6;
    --border:rgba(167,139,250,0.35);
  }
  * {
    box-sizing:border-box;
    font-family:Inter, Roboto, system-ui, sans-serif;
  }
  body {
    margin:0;
    padding:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at top left, rgba(124,58,237,0.25), #050617 60%);
    color:var(--text);
  }
  .container {
    width:90%;
    max-width:600px;
    padding:30px;
    background:var(--card);
    backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 0 25px rgba(167,139,250,0.2);
    animation:fadeIn .8s ease;
  }
  @keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1;}
  }
  h2 {
    text-align:center;
    font-weight:700;
    font-size:1.45rem;
    margin-bottom:10px;
    color:var(--violeta);
  }
  label {
    margin-top:14px;
    font-size:0.9rem;
    font-weight:600;
    display:block;
    color:var(--text);
  }
  select, input[type="date"], input[type="time"], input[type="text"] {
    width:100%;
    padding:12px;
    margin-top:6px;
    background:#111827;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
  }
  select:focus, input:focus {
    outline:1px solid var(--violeta-osc);
  }
  button {
    margin-top:28px;
    width:100%;
    padding:13px;
    font-size:1rem;
    border:none;
    border-radius:10px;
    background:linear-gradient(130deg, var(--violeta-osc), var(--violeta));
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:transform .2s ease, filter .2s ease;
  }
  button:hover {
    transform:scale(1.03);
    filter:brightness(1.1);
  }
  button:active {
    transform:scale(.96);
  }
  .hidden{ display:none; }
</style>
</head>

<body>
<div class="container">
  <h2>Generar Token de Capacitación</h2>

  <form method="POST"
        action="https://script.google.com/macros/s/AKfycbxKnKr51sIrPGAHLvvWEWpDiM5tUyUEJgXGWfdfFzRp7sybvWoR7JSy3SSKJi53KZLE/exec"
        onsubmit="return validarFormulario(this)">

    <label>Nombre del Formador:</label>
    <select name="formador" required>
      <option value="">Seleccione...</option>
      <option>Duber Herney Muñoz Ramos</option>
      <option>Jose Daniel Rubiano Rodriguez</option>
      <option>Miguel Oswaldo Gonzalez Castaño</option>
      <option>Sebastian David Merchán Junca</option>
      <option>Nestor Jair Basante Apraez</option>
      <option>Andres Felipe Tarazona</option>
      <option>Juan Felipe Villamil Torres</option>
    </select>

    <label>Tipo de Capacitación:</label>
    <select name="tipo" id="tipo" onchange="mostrarTema()" required>
      <option value="">Seleccione...</option>
      <option>Formación inicial masivo</option>
      <option>Excelencia operativa</option>
      <option>Personal en ascenso</option>
      <option>Preturnos</option>
      <option>Capacitacion precertificación</option>
      <option>Certificación al cargo</option>
    </select>

    <div id="temaSelectContainer" class="hidden">
      <label>Tema:</label>
      <select name="tema" id="temaSelect">
        <option value="">Seleccione...</option>
        <option>Dia 1 (Inducción corporativa cliente, modelo gana)</option>
        <option>Dia 2 (Fundamentos de telecomunicaciones - espectro electromagnetico)</option>
        <option>Dia 3 (Conectorización, herramienta, acometidas en redes hfc, materiales para una instalación)</option>
        <option>Dia 4 (Calibración interna en redes hfc, medidor de campo trilitic dsp 360)</option>
        <option>Dia 5 (CPE´s, red móvil 5G, OFSC, aplicativos cliente, conectorización norma T568B)</option>
        <option>Dia 6 (Fundamentos FTTH, redes neutras)</option>
        <option>Dia 7 (Conectorización redes FTTH, mediciones, tipos de conectores, materiales para una instalación FTTH)</option>
        <option>Dia 8 (Practica de alturas)</option>
        <option>Dia 9 (Inducción SSTA cliente, riesgo eléctrico)</option>
      </select>
    </div>

    <div id="temaInputContainer" class="hidden">
      <label>Tema:</label>
      <input type="text" name="tema" id="temaInput" placeholder="Escriba el tema">
    </div>

    <label>Fecha:</label>
    <input type="date" name="fecha" required>

    <label>Hora de inicio:</label>
    <input type="time" name="horaInicio" required>

    <label>Duración (horas):</label>
    <select name="duracion" required>
      <option value="">Seleccione...</option>
      <option value="8">8 horas</option>
      <option value="6">6 horas</option>
      <option value="4">4 horas</option>
      <option value="3">3 horas</option>
      <option value="2">2 horas</option>
    </select>

    <button type="submit" id="submitBtn">Generar Token</button>
  </form>
</div>

<script>
function mostrarTema(){
  const tipo = document.getElementById('tipo').value;
  const s = document.getElementById('temaSelectContainer');
  const i = document.getElementById('temaInputContainer');
  if (tipo === "Formación inicial masivo") {
    s.classList.remove('hidden');
    i.classList.add('hidden');
    document.getElementById('temaInput').value = "";
  } else if (tipo !== "") {
    s.classList.add('hidden');
    i.classList.remove('hidden');
    document.getElementById('temaSelect').value = "";
  } else {
    s.classList.add('hidden');
    i.classList.add('hidden');
    document.getElementById('temaSelect').value = "";
    document.getElementById('temaInput').value = "";
  }
}

function validarFormulario(form){
  const tipo = form.tipo.value.trim();
  const temaSelect = document.getElementById('temaSelect').value.trim();
  const temaInput = document.getElementById('temaInput').value.trim();
  let tema = (tipo === "Formación inicial masivo") ? temaSelect : temaInput;

  if (!form.formador.value.trim() || !tipo || !form.fecha.value.trim() || !tema ||
      !form.horaInicio.value.trim() || !form.duracion.value.trim()) {
    alert("Por favor complete todos los campos.");
    return false;
  }

  document.getElementById('submitBtn').innerText = "Generando...";
  document.getElementById('submitBtn').disabled = true;
  return true;
}
</script>
</body>
</html>
